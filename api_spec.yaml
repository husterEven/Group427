        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: contentType
          in: query
          schema:
            type: integer
          description: 按内容类型筛选（0帖子 1评论 2附件）
        - name: auditStatus
          in: query
          schema:
            type: integer
            default: 0
          description: 按审核状态筛选（默认0=待审核）
      responses:
        "200":
          description: 审核项列表
