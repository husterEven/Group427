  # ========================================
  # Notifications 通知模块
  # ========================================
  /notifications:
    get:
      tags: [Notifications]
      summary: 通知列表
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: type
          in: query
          schema:
            type: integer
          description: 按通知类型筛选（不传则全部）
      responses:
        "200":
          description: 通知列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: "#/components/schemas/Notification"
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
                      totalPages: { type: integer }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: 获取未读通知数
      responses:
        "200":
          description: 未读数
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 5 }

  /notifications/{notificationId}/read:
    put:
      tags: [Notifications]
      summary: 标记单条通知为已读
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已标记

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: 全部标记已读
      responses:
        "200":
          description: 全部已读

