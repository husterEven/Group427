  # ========================================
  /attachments/upload:
    post:
      tags: [Posts]
      summary: 上传附件（图片/文档/视频等）
      description: 先上传附件获得 attachmentId，再发布帖子时传入 attachmentIds
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 文件（最大 10MB，图片/jpg,png,gif/webp 文档/pdf,doc,docx）
      responses:
        "201":
          description: 上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 201 }
                  message: { type: string, example: "上传成功" }
                  data:
                    $ref: "#/components/schemas/Attachment"
        "400":
          description: 文件类型不支持或超过大小限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

