  # ========================================
  # Votes 投票模块
  # ========================================
  /posts/{postId}/vote:
    post:
      tags: [Votes]
      summary: 为帖子创建投票（作者在发帖后附加）
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteCreate"
      responses:
        "201":
          description: 投票创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 201 }
                  message: { type: string, example: "投票创建成功" }
                  data:
                    $ref: "#/components/schemas/VoteDetail"
        "400":
          description: 帖子已有投票或帖子非投票类型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Votes]
      summary: 获取帖子关联的投票详情（含各选项当前统计）
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 投票详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/VoteDetail"
        "404":
          description: 该帖子未关联投票
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /votes/{voteId}/submit:
    post:
      tags: [Votes]
      summary: 提交投票
      parameters:
        - name: voteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteSubmit"
      responses:
        "200":
          description: 投票成功，返回更新后的投票状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: "投票成功" }
                  data:
                    $ref: "#/components/schemas/VoteDetail"
        "400":
          description: 已投过票或投票已截止
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

